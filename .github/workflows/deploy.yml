name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - run: git submodule update --init themes/hugo-coder
      - id: fathli
        run: echo "sha=$(git rev-parse HEAD:apps/fathli)" >> "$GITHUB_OUTPUT"
      # fathli is private: fetch it with a read-only deploy key.
      - uses: actions/checkout@v7
        with:
          repository: tsumli/fathli
          ref: ${{ steps.fathli.outputs.sha }}
          ssh-key: ${{ secrets.FATHLI_DEPLOY_KEY }}
          path: apps/fathli
      - uses: jdx/mise-action@v5
      - id: pages
        uses: actions/configure-pages@v6
      - run: just build --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
